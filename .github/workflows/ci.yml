name: CI
on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1

      - name: Install Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.7

      - name: Run tests
        run: deno task test:all

      - name: Build
        run: deno task build
